version: '3.8'

services:
  threatlens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threatlens-soc-platform
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
